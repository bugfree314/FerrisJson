name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x64-tui
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Read version and check release tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          version = manifest['package']['version']
          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          package = next(p for p in lock['package'] if p['name'] == 'FerrisJson')
          if package['version'] != version:
              raise SystemExit('Cargo.toml and Cargo.lock versions differ')
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              if os.environ['GITHUB_REF_NAME'] != f'v{version}':
                  raise SystemExit(f'Release tag must be v{version}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'PACKAGE_VERSION={version}\n')
          PY

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The package example builds FerrisJson and includes README / LICENSE.
      # No tests, Clippy, formatting checks or benchmarks are run.
      - name: Build and package
        run: cargo run --release --locked --example package

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path target/release/bundle/* -DestinationPath "dist/FerrisJson-v$env:PACKAGE_VERSION-windows-x64.zip"

      - name: Archive macOS app
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/FerrisJson.app "dist/FerrisJson-v${PACKAGE_VERSION}-${PLATFORM}.zip"

      - name: Archive Linux TUI bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/FerrisJson-v${PACKAGE_VERSION}-linux-x64-tui.tar.gz" -C target/release/bundle FerrisJson README.md LICENSE

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Prepare draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(jq -r '.isDraft' release-state.json)" != true ]; then
              echo 'Refusing to replace assets on an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "FerrisJson $RELEASE_TAG" --generate-notes
          fi
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" dist/* --clobber
